<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panda &amp; Koala</title>
  <meta name="theme-color" content="#1a1a2e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐼</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #1a1a2e;
      color: #e94560;
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .star {
      position: fixed;
      background: #f1f1f1;
      pointer-events: none;
      animation: twinkle 3s steps(3) infinite;
    }
    .pixel-box {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      border: 4px solid #fff;
      padding: 24px 20px;
      background: #16213e;
      border-radius: 4px;
      box-shadow: 6px 6px 0 #0f3460;
    }
    .pets {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 30px;
      margin-bottom: 24px;
    }
    .pixel { position: relative; }
    .px-dot { position: absolute; left: 0; top: 0; display: block; }
    #heart { animation: beat 1.2s ease-in-out infinite; }
    #panda { animation: bob 2.2s ease-in-out infinite; }
    #koala { animation: bob 2.2s ease-in-out 1.1s infinite; }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.8; }
    }
    @keyframes blink { 50% { opacity: 0; } }

    .logo {
      font-size: 22px;
      line-height: 1.4;
      color: #f1f1f1;
      text-shadow: 3px 3px 0 #e94560;
    }
    .logo span {
      display: block;
      margin: 6px 0;
      font-size: 12px;
      color: #e94560;
      text-shadow: none;
    }
    .subtitle {
      font-size: 9px;
      color: #4ecca3;
      margin: 16px 0 24px;
    }
    .levels {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .level {
      position: relative;
      display: block;
      border: 3px solid #fff;
      background: #0f1a33;
      padding: 14px 14px 12px 34px;
      color: #f1f1f1;
      text-decoration: none;
      text-align: left;
      box-shadow: 3px 3px 0 #0f3460;
    }
    .level:hover, .level:focus-visible {
      outline: none;
      border-color: #4ecca3;
    }
    .level:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #0f3460;
    }
    .level:hover::before, .level:focus-visible::before {
      content: '';
      position: absolute;
      left: 12px;
      top: 50%;
      margin-top: -5px;
      border-left: 8px solid #e94560;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      animation: blink 1s steps(1) infinite;
    }
    .level-tag {
      display: block;
      font-size: 8px;
      color: #e94560;
      margin-bottom: 8px;
    }
    .level.special { border-color: #f9c74f; }
    .level.special .level-tag { color: #f9c74f; }
    .level-name {
      display: block;
      font-size: 11px;
      line-height: 1.5;
    }
    .level-desc {
      display: block;
      margin-top: 6px;
      font-family: 'VT323', monospace;
      font-size: 20px;
      color: #b8c1cc;
    }
    .hint {
      margin-top: 18px;
      font-size: 7px;
      color: #5a6472;
    }
  </style>
</head>
<body>
  <main class="pixel-box">
    <div class="pets">
      <div class="pixel" id="panda" title="panda"></div>
      <div class="pixel" id="heart"></div>
      <div class="pixel" id="koala" title="koala"></div>
    </div>

    <div class="logo">PANDA<span>&amp;</span>KOALA</div>
    <div class="subtitle">BÖLÜM SEÇ</div>

    <ul class="levels">
      <li>
        <a class="level special" href="dogum-gunu.html">
          <span class="level-tag">★ ÖZEL BÖLÜM</span>
          <span class="level-name">16 EKİM</span>
          <span class="level-desc">Bugün senin günün.</span>
        </a>
      </li>
      <li>
        <a class="level" href="enerji-barı.html">
          <span class="level-tag">BONUS</span>
          <span class="level-name">ENERJİ BARI</span>
          <span class="level-desc">Yorucu günler için küçük bir mola.</span>
        </a>
      </li>
      <li>
        <a class="level" href="birinci-ay.html">
          <span class="level-tag">BÖLÜM 1</span>
          <span class="level-name">İLK AY</span>
          <span class="level-desc">Birinci ayımız.</span>
        </a>
      </li>
    </ul>

    <div class="hint">GÖRMEK İÇİN BİR BÖLÜME DOKUN</div>
  </main>

  <script>
    const PX = 7;

    function drawPixelArt(id, rows, palette) {
      const host = document.getElementById(id);
      const out = [];
      rows.forEach((row, y) => {
        [...row].forEach((ch, x) => {
          const color = palette[ch];
          if (color) out.push(x * PX + 'px ' + y * PX + 'px ' + color);
        });
      });
      host.style.width = rows[0].length * PX + 'px';
      host.style.height = rows.length * PX + 'px';
      const dot = document.createElement('i');
      dot.className = 'px-dot';
      dot.style.width = dot.style.height = PX + 'px';
      dot.style.boxShadow = out.join(',');
      host.appendChild(dot);
    }

    drawPixelArt('heart', [
      '.XX...XX.',
      'XXXX.XXXX',
      'XXXXXXXXX',
      'XXXXXXXXX',
      '.XXXXXXX.',
      '..XXXXX..',
      '...XXX...',
      '....X....'
    ], { X: '#e94560' });

    drawPixelArt('panda', [
      'KK.....KK',
      'KKWWWWWKK',
      '.WWWWWWW.',
      '.KKWWWKK.',
      '.KKWWWKK.',
      '.WWWKWWW.',
      '.WWWWWWW.',
      '..WWWWW..'
    ], { K: '#3d3d5c', W: '#f1f1f1' });

    drawPixelArt('koala', [
      'GG.....GG',
      'GLG...GLG',
      'GGGGGGGGG',
      '.GGGGGGG.',
      '.GDGGGDG.',
      '.GGNNNGG.',
      '..GGNGG..',
      '...GGG...'
    ], { G: '#b8c1cc', L: '#e5c1cf', D: '#3d3d5c', N: '#5a6472' });

    for (let i = 0; i < 48; i++) {
      const s = document.createElement('div');
      const size = Math.random() < 0.75 ? 2 : 3;
      s.className = 'star';
      s.style.width = s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDuration = 2 + Math.random() * 4 + 's';
      s.style.animationDelay = -Math.random() * 6 + 's';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
